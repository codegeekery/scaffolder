name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries for all platforms
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -o dist/scaffolder-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -o dist/scaffolder-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -o dist/scaffolder-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -o dist/scaffolder-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -o dist/scaffolder-darwin-arm64 .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
